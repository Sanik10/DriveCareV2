services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"  # Только localhost
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 🔥 RESOURCE LIMITS: Production security
    deploy:
      resources:
        limits:
          memory: 1G        # Максимум 1GB RAM
          cpus: '1.0'       # Максимум 1 CPU core
        reservations:
          memory: 512M      # Гарантированно 512MB RAM
          cpus: '0.5'       # Гарантированно 0.5 CPU core

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"  # Только localhost
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 🔥 RESOURCE LIMITS: Production security
    deploy:
      resources:
        limits:
          memory: 256M      # Максимум 256MB RAM для Redis
          cpus: '0.5'       # Максимум 0.5 CPU core
        reservations:
          memory: 128M      # Гарантированно 128MB RAM
          cpus: '0.25'      # Гарантированно 0.25 CPU core

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
